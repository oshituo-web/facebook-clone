<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">

   <title>Facebook Clone</title>

   <!-- Main CSS -->
   <link rel="stylesheet" href="./css/style.css">
   <!-- Font Awesome -->
   <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
</head>

<body>

   <!-- Header Container (Role 3) -->
   <header class="facebook-header">

      <!-- Header Left Section -->
      <div class="header-left">

         <!-- Facebook Logo -->
         <i class="fa-brands fa-facebook"></i>

         <!-- Search -->
         <div class="search-container">
            <span class="search-icon">⌕</span>

            <input type="search" class="search-input" placeholder="Search Facebook" aria-label="Search Facebook">
         </div>

      </div>


      <!-- Main Navigation -->
      <nav class="main-navigation">

         <!-- Home -->
         <button class="nav-item active" data-action="home">
            <span class="nav-icon">⌂</span>
            <span class="nav-label">Home</span>
         </button>

         <!-- Friends -->
         <button class="nav-item" data-action="friends">
            <span class="nav-icon">♙</span>
            <span class="nav-label">Friends</span>
         </button>

         <!-- Video -->
         <button class="nav-item" data-action="video">
            <span class="nav-icon">▶</span>
            <span class="nav-label">Video</span>
         </button>

         <!-- Groups -->
         <button class="nav-item" data-action="groups">
            <span class="nav-icon">👥</span>
            <span class="nav-label">Groups</span>
         </button>

      </nav>


      <!-- Header Right Section -->
      <div class="header-right">

         <!-- Messages -->
         <button class="utility-button" data-action="messages">
            💬
            <span class="notification-badge"></span>
         </button>

         <!-- Notifications -->
         <button class="utility-button" data-action="notifications">
            🔔
            <span class="notification-badge"></span>
         </button>

      </div>

   </header>


   <!-- Main Layout Container -->
   <main class="main-layout">

      <!-- Left Sidebar (Role 7) -->
      <aside class="left-sidebar">
         <!-- left sidebar content -->
      </aside>


      <!-- Central Feed Section (Role 4) -->
      <section class="feed">

         <!-- Stories Section -->
         <section class="stories">
            <!-- Stories will be rendered here -->
         </section>


         <!-- Post Composer -->
         <section class="create-post">
            <!-- Create post interface will go here -->
         </section>


         <!-- Dynamic Posts Container -->
         <section class="posts">
            <!-- Posts will be rendered here -->
         </section>

      </section>


      <!-- Right Sidebar (Role 7) -->
      <aside class="right-sidebar">
         <!-- Right sidebar content -->
      </aside>

   </main>


   <!-- JavaScript -->
<script type="module" src="./js/script.js"></script>
</body>

</html>
