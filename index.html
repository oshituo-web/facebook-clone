<!DOCTYPE html>
<html lang="en">

   <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">

      <title>Facebook Clone</title>

      <!-- Stylesheets -->
      <link rel="stylesheet" href="./css/base.css">
      <link rel="stylesheet" href="./css/layout.css">
      <link rel="stylesheet" href="./css/header.css">
      <link rel="stylesheet" href="./css/feed.css">
      <link rel="stylesheet" href="./css/sidebar-left.css">
      <link rel="stylesheet" href="./css/sidebar-right.css">
      <link rel="stylesheet" href="./css/auth.css">
      <link rel="stylesheet" href="./css/responsive.css">

      <!-- Font Awesome -->
      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
   </head>

   <body>

      <!-- Header Container (Role 3) -->
      <header class="facebook-header">

         <!-- Header Left Section -->
         <div class="header-left">

            <!-- Facebook Logo -->
            <i class="fa-brands fa-facebook"></i>

            <!-- Search -->
            <div class="search-container">
               <i class="fa-solid fa-magnifying-glass"></i>
               <input type="search" class="search-input" placeholder="Search Facebook" aria-label="Search Facebook">
            </div>

         </div>


         <!-- Main Navigation -->
         <nav class="main-navigation">

            <!-- Home -->
            <button class="nav-item" data-action="home">
               <i class="fa-regular fa-house"></i>
               <span class="text">Home</span>
            </button>

            <!-- Video -->
            <button class="nav-item" data-action="video">
               <i class="fa-solid fa-film"></i>
               <span class="text">Video</span>
            </button>

            <!-- Marketplace -->
            <button class="nav-item" data-action="marketplace">
               <i class="fa-solid fa-store"></i>
               <span class="text">Marketplace</span>
            </button>

            <!-- Friends -->
            <button class="nav-item" data-action="friends">
               <i class="fa-regular fa-user"></i>
               <span class="text">Friends</span>
            </button>

            <!-- Groups -->
            <button class="nav-item" data-action="groups">
               <i class="fa-solid fa-users"></i>
               <span class="text">Groups</span>
            </button>

         </nav>


         <!-- Header Right Section -->
         <div class="header-right">

            <!-- Menu -->
            <button class="utility-button" data-action="menu">
               <i class="fa-solid fa-bars"></i>
               <span class="text">Menu</span>
            </button>

            <!-- Notifications -->
            <button class="utility-button" data-action="notifications">
               <i class="fa-solid fa-bell"></i>
               <span class="text">Notifications</span>
            </button>

            <!-- Messenger -->
            <button class="utility-button" data-action="messenger">
               <i class="fa-brands fa-facebook-messenger"></i>
               <span class="text">Messenger</span>
            </button>

            <!-- Profile -->
            <button class="utility-button" data-action="profile">
               <i class="fa-regular fa-user"></i>
               <span class="text">Profile</span>
            </button>


         </div>

      </header>


      <!-- Main Layout Container -->
      <main class="main-layout">

         <!-- Left Sidebar (Role 7) -->
         <aside class="left-sidebar">
            <!-- left sidebar content -->
         </aside>


         <!-- Central Feed Section (Role 4) -->
         <section class="feed">

            <!-- Stories Section -->
            <section class="stories">
               <!-- Stories will be rendered here -->
            </section>


            <!-- Post Composer -->
            <section class="create-post">
               <!-- Create post interface will go here -->
            </section>


            <!-- Dynamic Posts Container -->
            <section class="posts">
               <!-- Posts will be rendered here -->
            </section>

         </section>


         <!-- Right Sidebar (Role 7) -->
         <aside class="right-sidebar">
            <!-- Right sidebar content -->
         </aside>

      </main>


      <!-- JavaScript -->
      <script type="module" src="./js/script.js"></script>
   </body>

</html>
