<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In | Social Connect Student Project</title>
    <link rel="stylesheet" href="./css/auth.css">
</head>

<body class="auth-page">
    <main class="auth-container">
        <section class="auth-brand">
            <h1>Social Connect</h1>
            <p>
                A student-built social media interface project for educational
                demonstration. This is not affiliated with or endorsed by Meta
                or Facebook. Do not enter your Facebook account credentials.
            </p>
        </section>

        <section class="auth-card">
            <h2>Log in to your Social Connect account</h2>

            <form id="loginForm">
                <label for="loginEmail">Email address</label>
                <input 
                id="loginEmail"
                name="email"
                type="email"
                placeholder="Enter your email"
                autocomplete="email"
                required
                >
            
                <label for="loginPassword">Password</label>
                <input 
                id="loginPassword"
                name="password"
                type="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
                >

                <p id="authMessage" class="auth-message" role="status" aria-live="polite"></p>

                <button id="loginButton" type="submit">Log In</button>
            </form>

            <p class="auth-switch">Don't have an account?
                <a href="./signup.html">Create a new account</a>
            </p>
        </section>
    </main>

    <script type="module" src="./js/auth.js"></script>
</body>

</html>
